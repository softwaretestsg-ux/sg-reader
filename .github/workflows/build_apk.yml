name: Build Social Googol SG Reader Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Official Social Googol Release Keystore
        run: |
          mkdir -p android/app
          if [ -f android/app/keystore.base64 ]; then
            base64 -d android/app/keystore.base64 > android/app/socialgoogol_release.jks
            echo "Keystore restored successfully."
          fi

      - name: Set up Flutter (Pinned Stable 3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Generate Android Platform Files
        run: |
          flutter create . --org com.socialgoogol --project-name sg_reader --platforms android
          rm -f android/settings.gradle.kts android/build.gradle.kts
          # Apply official Social Googol launcher branding
          cp -r assets/branding/res/mipmap-* android/app/src/main/res/

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Proof Tests (Read, Edit, Save, Share)
        run: flutter test test/document_crud_test.dart

      - name: Build Official Signed Release APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --build-name="1.7.0" --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader-v1.7.0.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SG-Reader-v1.7.0-Release
          path: "build/app/outputs/flutter-apk/SG-Reader.apk"

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.7.0
          name: "Social Googol SG Reader (Major Release v1.7.0 - Top 5 Powerhouse)"
          body: |
            ### 🛡️ Social Googol's SG Reader - Official Android APK (v1.7.0)
            **Tagline:** Secure to Grow - सुरक्षा से ग्रोथ तक
            **Website:** https://www.socialgoogol.com
            **Helpline:** +91 81262 10003

            ---
            ### 🚀 What's New in v1.7.0 (The Top-5 Triple Powerhouse):
            - **1. The PDF Powerhouse Suite:**
              - **Digital Signature (Fill & Sign):** Fingerprint/pen canvas with legal ink colors (Royal Blue, Black, Crimson, Green) and 1-tap transparent placement onto any PDF page.
              - **Smart PDF Compressor:** 1-tap offline compression optimizing streams and downsampling images for easy WhatsApp and email sharing (<2MB).
              - **Multi-PDF Merge:** Select 2 or more PDFs to combine into a unified, organized document.
              - **Page Split & Extraction:** Export select page ranges into standalone PDFs.
            - **2. Photo-to-Spreadsheet (Table Extractor):**
              - 100% on-device spatial table parsing: photograph any printed table, price list, invoice, or receipt and convert it directly into an editable Microsoft Excel (`.xlsx`) sheet.
            - **3. Liquid Mode & Offline Text-to-Speech (TTS):**
              - **Responsive Liquid Reflow:** Eliminates pinch fatigue by reflowing PDF pages into continuous mobile reading mode with font scaling (A-/A+) and reading themes (Paper White, Sepia Warmth, AMOLED Night).
              - **Natural Voice Reader (TTS):** Listen to documents hands-free with background playback, speed control (0.75x to 2.0x), and bilingual language switching (English & Hindi).
            - **Version Bump:**
              - Updated to `v1.7.0 • Build 25`.

            ### 📲 Direct 1-Click APK Download:
            Download the official signed release directly to your Android device below:
          files: |
            build/app/outputs/flutter-apk/SG-Reader.apk
            build/app/outputs/flutter-apk/SG-Reader-v1.7.0.apk
