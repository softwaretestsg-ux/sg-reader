name: Build Social Googol SG Reader Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Official Social Googol Release Keystore
        run: |
          mkdir -p android/app
          if [ -f android/app/keystore.base64 ]; then
            base64 -d android/app/keystore.base64 > android/app/socialgoogol_release.jks
            echo "Keystore restored successfully."
          fi

      - name: Set up Flutter (Pinned Stable 3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Generate Android Platform Files
        run: |
          flutter create . --org com.socialgoogol --project-name sg_reader --platforms android
          rm -f android/settings.gradle.kts android/build.gradle.kts
          # Apply official Social Googol launcher branding
          cp -r assets/branding/res/mipmap-* android/app/src/main/res/

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Proof Tests (Read, Edit, Save, Share)
        run: flutter test test/document_crud_test.dart

      - name: Build Official Signed Release APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --build-name="1.5.2" --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader-v1.5.2.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SG-Reader-v1.5.2-Release
          path: "build/app/outputs/flutter-apk/SG-Reader.apk"

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.5.2
          name: "Social Googol SG Reader (Official Release v1.5.2)"
          body: |
            ### 🛡️ Social Googol's SG Reader - Official Android APK (v1.5.2)
            **Tagline:** Secure to Grow - सुरक्षा से ग्रोथ तक
            **Website:** https://www.socialgoogol.com
            **Helpline:** +91 81262 10003

            ---
            ### 🔄 What's New in v1.5.2:
            - **Universal Document Zoom Engine (Two-Finger Pinch & On-Screen Dock):**
              - **PDF Documents:** Native fluid multi-touch pinch-to-zoom up to 500% with double-tap zoom and synchronized floating dock controls.
              - **Word (.docx):** Dynamic pinch-to-zoom viewport with live bidirectional bridge synchronization and `+` / `−` zoom dock.
              - **Excel (.xlsx):** Interactive pinch-to-zoom grid inspection and on-screen zoom dock with live zoom percentage reset.
              - **PowerPoint (.pptx):** Fluid multi-touch `InteractiveViewer` slide canvas with pinch-to-zoom and zoom dock.
              - **Translucent Floating Zoom Dock:** Auto-fading modern dock with zoom-out (`−`), live zoom percentage chip (tap to reset to 100%), and zoom-in (`+`).
            - **Executive UI/UX Refinements:**
              - Clean layout positioning preventing any overlap with bottom actions.
              - Full backwards compatibility and high-performance offline rendering.
              - Upgraded to `v1.5.2 • Build 20`.

            ### 📲 Direct 1-Click APK Download:
            Download the official signed release directly to your Android device below:
          files: |
            build/app/outputs/flutter-apk/SG-Reader.apk
            build/app/outputs/flutter-apk/SG-Reader-v1.5.2.apk
