name: Build Social Googol SG Reader Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Official Social Googol Release Keystore
        run: |
          mkdir -p android/app
          if [ -f android/app/keystore.base64 ]; then
            base64 -d android/app/keystore.base64 > android/app/socialgoogol_release.jks
            echo "Keystore restored successfully."
          fi

      - name: Set up Flutter (Pinned Stable 3.47.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Generate Android Platform Files
        run: |
          flutter create . --org com.socialgoogol --project-name sg_reader --platforms android
          rm -f android/settings.gradle.kts android/build.gradle.kts
          # Apply official Social Googol launcher branding
          cp -r assets/branding/res/mipmap-* android/app/src/main/res/

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Proof Tests (Read, Edit, Save, Share)
        run: flutter test test/document_crud_test.dart

      - name: Build Official Signed Release APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --build-name="1.6.0" --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader-v1.6.0.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SG-Reader-v1.6.0-Release
          path: "build/app/outputs/flutter-apk/SG-Reader.apk"

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.6.0
          name: "Social Googol SG Reader (Official Release v1.6.0)"
          body: |
            ### 🛡️ Social Googol's SG Reader - Official Android APK (v1.6.0)
            **Tagline:** Secure to Grow - सुरक्षा से ग्रोथ तक
            **Website:** https://www.socialgoogol.com
            **Helpline:** +91 81262 10003

            ---
            ### 🔄 What's New in v1.6.0:
            - **100% Offline Neural OCR Engine (Optical Character Recognition):**
              - **Bilingual On-Device Recognition:** Extracts text locally with zero cloud calls in both English (Latin) and Hindi (Devanagari script).
              - **Interactive OCR Result Screen:** Full paragraph viewing, live word/character statistics, and text editing.
              - **1-Tap Actions:** Copy all text to clipboard with haptic feedback, share via standard Android share sheet.
              - **Word Processor & Plain Text Integration:** Export extracted text directly to editable Word (.docx) or .txt documents.
              - **Scanner & Home Screen Integration:** Trigger OCR directly from document scans, camera captures, or gallery imports.
            - **Document Zoom & Performance:**
              - Retains sub-100% zoom scaling down to 35% across PDF, Word, Excel, and PowerPoint.
              - Upgraded to `v1.6.0 • Build 22`.

            ### 📲 Direct 1-Click APK Download:
            Download the official signed release directly to your Android device below:
          files: |
            build/app/outputs/flutter-apk/SG-Reader.apk
            build/app/outputs/flutter-apk/SG-Reader-v1.6.0.apk
