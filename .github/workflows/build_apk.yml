name: Build Social Googol SG Reader Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Generate Android Platform Files
        run: |
          flutter create . --org com.socialgoogol --project-name sg_reader --platforms android

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Proof Tests (Read, Edit, Save, Share)
        run: flutter test test/document_crud_test.dart

      - name: Build Release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG Reader.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Reader-Release-APK
          path: "build/app/outputs/flutter-apk/SG Reader.apk"
