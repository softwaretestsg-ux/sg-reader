name: Build Social Googol SG Reader Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Official Social Googol Release Keystore
        run: |
          mkdir -p android/app
          if [ -f android/app/keystore.base64 ]; then
            base64 -d android/app/keystore.base64 > android/app/socialgoogol_release.jks
            echo "Keystore restored successfully."
          fi

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Generate Android Platform Files
        run: |
          flutter create . --org com.socialgoogol --project-name sg_reader --platforms android
          # Apply official Social Googol launcher branding
          cp -r assets/branding/res/mipmap-* android/app/src/main/res/

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Proof Tests (Read, Edit, Save, Share)
        run: flutter test test/document_crud_test.dart

      - name: Build Official Signed Release APK
        run: |
          BUILD_NUM=${{ github.run_number }}
          flutter build apk --release --build-number=$BUILD_NUM --build-name="1.0.$BUILD_NUM" --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG-Reader.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SG-Reader-Release-APK
          path: "build/app/outputs/flutter-apk/SG-Reader.apk"

      - name: Publish Direct APK Download on GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Social Googol SG Reader (Official Release v1.0.0)"
          body: |
            ### 🛡️ Social Googol's SG Reader - Official Android APK
            **Tagline:** Secure to Grow - सुरक्षा से ग्रोथ तक
            **Website:** https://www.socialgoogol.com
            **Helpline:** +91 81262 10003

            ---
            ### ⚠️ Important Note Before Installing:
            If you previously installed a test build of this app, **please uninstall the old version from your device first** before tapping the link below. Android blocks updates between builds signed with different temporary keys.

            ### 📲 Direct 1-Click APK Download:
            Download the official signed release directly to your Android device below:
          files: |
            build/app/outputs/flutter-apk/SG-Reader.apk
