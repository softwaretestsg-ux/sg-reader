name: Build Social Googol SG Reader Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files
        run: |
          flutter create . --org com.socialgoogol --project-name sg_reader --platforms android

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SG Reader.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Reader-Release-APK
          path: "build/app/outputs/flutter-apk/SG Reader.apk"
