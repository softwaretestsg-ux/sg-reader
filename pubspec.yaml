name: sg_reader
description: "Social Googol's SG Reader - Secure, Lightweight Document Reader & Editor for Android."
publish_to: "none"
version: 1.5.0+18

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Device & UI Utilities
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.2
  share_plus: ^10.1.2
  webview_flutter: ^4.10.0

  # Document engines (Robust, Active, Fully Tested on Android 10-15)
  syncfusion_flutter_pdfviewer: ^28.2.12
  syncfusion_flutter_pdf: ^28.2.12
  excel: ^4.0.3
  archive: ^3.4.10
  xml: ^6.5.0

  # Iconography
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  image_picker_android: 0.8.12+16

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/offline_editors/excel/
    - assets/offline_editors/word/
