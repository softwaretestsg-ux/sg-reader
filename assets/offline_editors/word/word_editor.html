<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Social Googol SG Word Processor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #171310;
      color: #1F1913;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #top_header {
      background-color: #1F1913;
      border-bottom: 1px solid #2E251E;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .badge {
      background-color: #2E2218;
      border: 1px solid #B04A24;
      color: #DD8B53;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .btn-save {
      background-color: #B04A24;
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    #toolbar_container {
      background-color: #241D17;
      border-bottom: 1px solid #362A1F;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      z-index: 90;
    }
    #toolbar_container::-webkit-scrollbar {
      display: none;
    }
    .t-btn {
      background: #1B1510;
      border: 1px solid #362A1F;
      color: #F2ECE1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-width: 34px;
      text-align: center;
    }
    .t-btn:active, .t-btn.active {
      background: #B04A24;
      color: #FFFFFF;
      border-color: #DD8B53;
    }
    /* Floating Line & Paragraph Action Bar */
    #block_actions_bar {
      display: none;
      background-color: #2D231B;
      border-bottom: 1px solid #B04A24;
      padding: 6px 10px;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      z-index: 80;
    }
    .block-btn {
      background-color: #171310;
      border: 1px solid #3D3126;
      color: #DD8B53;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .block-btn:active {
      background-color: #B04A24;
      color: #FFFFFF;
    }
    #editor_wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 80px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #171310;
      -webkit-overflow-scrolling: touch;
    }
    #document_canvas {
      width: 100%;
      max-width: 840px;
      min-height: 100vh;
      background-color: #FFFFFF;
      color: #1A1A1A;
      padding: 28px 22px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      outline: none;
      font-size: 15.5px;
      line-height: 1.65;
    }
    #document_canvas p, #document_canvas h1, #document_canvas h2, #document_canvas h3, #document_canvas li {
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.15s, border 0.15s;
      cursor: text;
    }
    .selected-block {
      background-color: #FFF6F0 !important;
      outline: 2px solid #B04A24 !important;
    }
    #document_canvas p {
      margin-bottom: 12px;
    }
    #document_canvas h1 {
      font-size: 23px;
      margin: 18px 0 10px 0;
      color: #111111;
      border-bottom: 1px solid #EAEAEA;
      padding-bottom: 6px;
    }
    #document_canvas h2 {
      font-size: 19px;
      margin: 14px 0 8px 0;
      color: #222222;
    }
    #document_canvas ul, #document_canvas ol {
      margin-left: 26px;
      margin-bottom: 14px;
    }
    #document_canvas table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
    }
    #document_canvas td, #document_canvas th {
      border: 1px solid #CCCCCC;
      padding: 8px;
    }
    /* Dedicated Modal for Editing Specific Line/Paragraph */
    #edit_modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #1F1913;
      border: 1px solid #B04A24;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-title {
      color: #F2ECE1;
      font-size: 16px;
      font-weight: bold;
    }
    #modal_textarea {
      width: 100%;
      height: 140px;
      background: #171310;
      border: 1px solid #3D3126;
      border-radius: 8px;
      color: #FFFFFF;
      padding: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: vertical;
    }
    #modal_textarea:focus {
      border-color: #DD8B53;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #3D3126;
      color: #A89F91;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-apply {
      background: #B04A24;
      border: none;
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    #loading_overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171310;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 4px solid #2E251E;
      border-top: 4px solid #DD8B53;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="top_header">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="badge">DOCX</span>
      <span id="doc_meta" style="color:#A89F91; font-size:12px;">Word Processor Suite</span>
    </div>
    <button class="btn-save" onclick="saveDocument()">Save Word</button>
  </div>

  <!-- Formatting Toolbar -->
  <div id="toolbar_container">
    <button class="t-btn" onclick="execCmd('bold')"><b>B</b></button>
    <button class="t-btn" onclick="execCmd('italic')"><i>I</i></button>
    <button class="t-btn" onclick="execCmd('underline')"><u>U</u></button>
    <button class="t-btn" onclick="execCmd('strikeThrough')"><s>S</s></button>
    <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
    <button class="t-btn" onclick="execFormatBlock('H1')">H1</button>
    <button class="t-btn" onclick="execFormatBlock('H2')">H2</button>
    <button class="t-btn" onclick="execFormatBlock('P')">P</button>
    <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
    <button class="t-btn" onclick="execCmd('insertUnorderedList')">• List</button>
    <button class="t-btn" onclick="execCmd('insertOrderedList')">1. List</button>
    <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
    <button class="t-btn" onclick="execCmd('justifyLeft')">Left</button>
    <button class="t-btn" onclick="execCmd('justifyCenter')">Center</button>
    <button class="t-btn" onclick="execCmd('justifyRight')">Right</button>
    <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
    <button class="t-btn" onclick="execCmd('undo')">↺</button>
    <button class="t-btn" onclick="execCmd('redo')">↻</button>
  </div>

  <!-- Smart Line / Paragraph Touch Bar -->
  <div id="block_actions_bar">
    <span style="color:#DD8B53; font-size:12px; font-weight:bold; margin-right:4px;">Line:</span>
    <button class="block-btn" onclick="openFocusEdit()">✏️ Edit Text</button>
    <button class="block-btn" onclick="insertLineAbove()">+ Line Above</button>
    <button class="block-btn" onclick="insertLineBelow()">+ Line Below</button>
    <button class="block-btn" onclick="deleteSelectedBlock()">🗑 Delete</button>
  </div>

  <div id="editor_wrapper">
    <div id="document_canvas" contenteditable="true" spellcheck="false">
      <p>Loading document...</p>
    </div>
  </div>

  <!-- Focus Edit Modal for Mobile Precision -->
  <div id="edit_modal">
    <div class="modal-box">
      <div class="modal-title">Edit Line / Paragraph</div>
      <textarea id="modal_textarea" placeholder="Edit line content here..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeFocusEdit()">Cancel</button>
        <button class="btn-apply" onclick="applyFocusEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="loading_overlay">
    <div class="spinner"></div>
    <div style="margin-top:14px; color:#DD8B53; font-weight:600; font-size:14px;">Opening All Pages...</div>
    <div style="margin-top:6px; color:#A89F91; font-size:11px;">100% On-Device Processing</div>
  </div>

  <script src="mammoth.browser.min.js"></script>
  <script src="html-docx.js"></script>
  <script>
    var originalFileName = 'document.docx';
    var selectedElement = null;

    function execCmd(command, value) {
      document.execCommand(command, false, value || null);
      document.getElementById('document_canvas').focus();
    }

    function execFormatBlock(tag) {
      document.execCommand('formatBlock', false, '<' + tag + '>');
      document.getElementById('document_canvas').focus();
    }

    // Touch selection handling
    document.getElementById('document_canvas').addEventListener('click', function(e) {
      var target = e.target;
      while (target && target.parentNode && target.parentNode.id !== 'document_canvas' && target.id !== 'document_canvas') {
        target = target.parentNode;
      }
      if (target && target.id !== 'document_canvas') {
        selectBlock(target);
      }
    });

    function selectBlock(el) {
      if (selectedElement) {
        selectedElement.classList.remove('selected-block');
      }
      selectedElement = el;
      selectedElement.classList.add('selected-block');
      document.getElementById('block_actions_bar').style.display = 'flex';
    }

    function openFocusEdit() {
      if (!selectedElement) return;
      var text = selectedElement.innerText || '';
      document.getElementById('modal_textarea').value = text;
      document.getElementById('edit_modal').style.display = 'flex';
      setTimeout(() => document.getElementById('modal_textarea').focus(), 150);
    }

    function closeFocusEdit() {
      document.getElementById('edit_modal').style.display = 'none';
    }

    function applyFocusEdit() {
      if (!selectedElement) return;
      var newText = document.getElementById('modal_textarea').value;
      selectedElement.innerText = newText;
      closeFocusEdit();
    }

    function insertLineAbove() {
      if (!selectedElement) return;
      var p = document.createElement('p');
      p.innerText = 'New paragraph';
      selectedElement.parentNode.insertBefore(p, selectedElement);
      selectBlock(p);
    }

    function insertLineBelow() {
      if (!selectedElement) return;
      var p = document.createElement('p');
      p.innerText = 'New paragraph';
      if (selectedElement.nextSibling) {
        selectedElement.parentNode.insertBefore(p, selectedElement.nextSibling);
      } else {
        selectedElement.parentNode.appendChild(p);
      }
      selectBlock(p);
    }

    function deleteSelectedBlock() {
      if (!selectedElement) return;
      var parent = selectedElement.parentNode;
      selectedElement.remove();
      selectedElement = null;
      document.getElementById('block_actions_bar').style.display = 'none';
      if (parent && parent.children.length === 0) {
        parent.innerHTML = '<p><br></p>';
      }
    }

    function base64ToArrayBuffer(base64) {
      var binary_string = window.atob(base64);
      var len = binary_string.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function blobToBase64(blob, callback) {
      var reader = new FileReader();
      reader.onloadend = function() {
        var base64data = reader.result.split(',')[1];
        callback(base64data);
      };
      reader.readAsDataURL(blob);
    }

    window.loadDocument = function(base64Data, filename) {
      try {
        originalFileName = filename || 'document.docx';
        var arrayBuffer = base64ToArrayBuffer(base64Data);

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(function(result) {
            var html = result.value || '<p>Empty Document</p>';
            document.getElementById('document_canvas').innerHTML = html;
            document.getElementById('loading_overlay').style.display = 'none';
            notifyFlutter('loaded', { warnings: result.messages });
          })
          .catch(function(err) {
            console.error('Mammoth conversion error:', err);
            document.getElementById('document_canvas').innerHTML = '<p>Unable to load formatting: ' + err.message + '</p>';
            document.getElementById('loading_overlay').style.display = 'none';
            notifyFlutter('error', { error: err.message });
          });
      } catch (err) {
        console.error('Error in loadDocument:', err);
        document.getElementById('loading_overlay').innerHTML = 
          '<div style="color:#E5534B; padding:20px; text-align:center;"><b>Error loading document:</b><br>' + err.message + '</div>';
        notifyFlutter('error', { error: err.message });
      }
    };

    window.saveDocument = function() {
      try {
        // Remove selection highlight before saving
        if (selectedElement) {
          selectedElement.classList.remove('selected-block');
        }
        var canvasHtml = document.getElementById('document_canvas').innerHTML;
        var fullHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + canvasHtml + '</body></html>';
        
        var convertedBlob = htmlDocx.asBlob(fullHtml);
        blobToBase64(convertedBlob, function(base64Output) {
          notifyFlutter('save', {
            base64: base64Output,
            filename: originalFileName,
            format: 'docx'
          });
        });
      } catch (err) {
        console.error('Error saving Word document:', err);
        notifyFlutter('error', { error: err.message });
      }
    };

    function notifyFlutter(action, payload) {
      var msg = JSON.stringify({ action: action, payload: payload });
      if (window.SGReaderBridge) {
        window.SGReaderBridge.postMessage(msg);
      } else {
        console.log('Bridge message:', msg);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        notifyFlutter('ready', {});
      }, 300);
    });
  </script>
</body>
</html>
