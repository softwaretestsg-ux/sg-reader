<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Social Googol SG Word Processor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ECE8E1;
      color: #1A1A1A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Top Sub-Header */
    #top_header {
      background-color: #1F1913;
      border-bottom: 1px solid #2E251E;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      flex-shrink: 0;
    }
    .badge {
      background-color: #2E2218;
      border: 1px solid #B04A24;
      color: #DD8B53;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    #doc_metrics {
      color: #A89F91;
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 55vw;
    }
    .btn-save {
      background-color: #B04A24;
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-save:active {
      background-color: #DD8B53;
    }

    /* Formatting Toolbar */
    #toolbar_container {
      background-color: #241D17;
      border-bottom: 1px solid #362A1F;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      z-index: 90;
      flex-shrink: 0;
    }
    #toolbar_container::-webkit-scrollbar {
      display: none;
    }
    .t-btn {
      background: #1B1510;
      border: 1px solid #362A1F;
      color: #F2ECE1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-width: 34px;
      text-align: center;
    }
    .t-btn:active, .t-btn.active {
      background: #B04A24;
      color: #FFFFFF;
      border-color: #DD8B53;
    }
    .t-sep {
      width: 1px;
      height: 20px;
      background: #3D3126;
      margin: 0 4px;
      display: inline-block;
    }

    /* Quick Inline Action Bar */
    #quick_actions_bar {
      background-color: #2D231B;
      border-bottom: 1px solid #B04A24;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      z-index: 85;
      flex-shrink: 0;
    }
    #quick_actions_bar::-webkit-scrollbar {
      display: none;
    }
    .action-btn {
      background-color: #171310;
      border: 1px solid #3D3126;
      color: #DD8B53;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn:active {
      background-color: #B04A24;
      color: #FFFFFF;
    }

    /* Outer Scroll Wrapper - Document Desk (NO flex column collapse) */
    #editor_wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #ECE8E1;
      padding: 16px 10px 100px 10px;
      -webkit-overflow-scrolling: touch;
      display: block;
    }

    /* Paper Document Canvas - Full Multi-Page Continuous Surface */
    #document_canvas {
      box-sizing: border-box;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      min-height: calc(100vh - 140px);
      height: auto !important;
      background-color: #FFFFFF !important;
      color: #1A1A1A !important;
      padding: 28px 22px;
      border-radius: 6px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.15);
      outline: none;
      font-size: 15.5px;
      line-height: 1.65;
      display: block;
      overflow: visible;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Guarantee High-Contrast Dark Text across all generated elements */
    #document_canvas p,
    #document_canvas span,
    #document_canvas div,
    #document_canvas h1,
    #document_canvas h2,
    #document_canvas h3,
    #document_canvas h4,
    #document_canvas h5,
    #document_canvas h6,
    #document_canvas li,
    #document_canvas td,
    #document_canvas th,
    #document_canvas strong,
    #document_canvas em,
    #document_canvas b,
    #document_canvas i {
      color: #1A1A1A !important;
    }

    #document_canvas p {
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    #document_canvas h1 {
      font-size: 24px;
      margin: 20px 0 10px 0;
      color: #111111 !important;
      border-bottom: 1px solid #E2DDD5;
      padding-bottom: 6px;
    }
    #document_canvas h2 {
      font-size: 19px;
      margin: 16px 0 8px 0;
      color: #B04A24 !important;
      border-bottom: 1px solid #EDE8E1;
      padding-bottom: 4px;
    }
    #document_canvas h3 {
      font-size: 17px;
      margin: 12px 0 6px 0;
      color: #222222 !important;
    }

    #document_canvas ul, #document_canvas ol {
      margin-left: 26px;
      margin-bottom: 14px;
    }
    #document_canvas li {
      margin-bottom: 6px;
    }

    /* Responsive Tables - Critical for Resumes & Reports */
    #document_canvas table {
      width: 100% !important;
      max-width: 100% !important;
      border-collapse: collapse;
      margin: 14px 0;
      background-color: #FFFFFF !important;
      table-layout: auto;
    }
    #document_canvas td, #document_canvas th {
      border: 1px solid #D5D0C8 !important;
      padding: 8px 10px;
      background-color: #FFFFFF !important;
      color: #1A1A1A !important;
      vertical-align: top;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    #document_canvas th {
      background-color: #F8F6F2 !important;
      font-weight: bold;
    }

    /* Visual Page Separator */
    .page-separator {
      border-top: 2px dashed #C8C3BA;
      margin: 32px 0;
      position: relative;
      text-align: center;
      height: 1px;
    }
    .page-separator::after {
      content: attr(data-page-label);
      position: relative;
      top: -11px;
      background: #ECE8E1;
      padding: 2px 10px;
      font-size: 11px;
      color: #7D7365;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #D2CCC2;
    }

    /* Loading Overlay */
    #loading_overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171310;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 4px solid #2E251E;
      border-top: 4px solid #DD8B53;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="top_header">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="badge">DOCX</span>
      <span id="doc_metrics">Opening Document...</span>
    </div>
    <button class="btn-save" onclick="saveDocument()">Save Word</button>
  </div>

  <!-- Formatting Toolbar -->
  <div id="toolbar_container">
    <button class="t-btn" onclick="execCmd('bold')"><b>B</b></button>
    <button class="t-btn" onclick="execCmd('italic')"><i>I</i></button>
    <button class="t-btn" onclick="execCmd('underline')"><u>U</u></button>
    <button class="t-btn" onclick="execCmd('strikeThrough')"><s>S</s></button>
    <div class="t-sep"></div>
    <button class="t-btn" onclick="execFormatBlock('H1')">H1</button>
    <button class="t-btn" onclick="execFormatBlock('H2')">H2</button>
    <button class="t-btn" onclick="execFormatBlock('P')">Normal</button>
    <div class="t-sep"></div>
    <button class="t-btn" onclick="execCmd('insertUnorderedList')">• Bullet</button>
    <button class="t-btn" onclick="execCmd('insertOrderedList')">1. List</button>
    <div class="t-sep"></div>
    <button class="t-btn" onclick="execCmd('justifyLeft')">Left</button>
    <button class="t-btn" onclick="execCmd('justifyCenter')">Center</button>
    <button class="t-btn" onclick="execCmd('justifyRight')">Right</button>
    <div class="t-sep"></div>
    <button class="t-btn" onclick="execCmd('undo')">↺</button>
    <button class="t-btn" onclick="execCmd('redo')">↻</button>
  </div>

  <!-- Quick Paragraph & Line Toolbar -->
  <div id="quick_actions_bar">
    <span style="color:#DD8B53; font-size:11px; font-weight:bold;">Document:</span>
    <button class="action-btn" onclick="insertParagraph()">+ Add Paragraph</button>
    <button class="action-btn" onclick="deleteCurrentBlock()">🗑 Delete Line</button>
    <button class="action-btn" onclick="execCmd('removeFormat')">Clear Style</button>
    <button class="action-btn" onclick="scrollToTop()">↑ Top</button>
    <button class="action-btn" onclick="scrollToBottom()">↓ Bottom</button>
  </div>

  <!-- Main Scrollable Document Area (Pure Paper Canvas) -->
  <div id="editor_wrapper">
    <div id="document_canvas" contenteditable="true" spellcheck="false">
      <p>Loading document pages...</p>
    </div>
  </div>

  <div id="loading_overlay">
    <div class="spinner"></div>
    <div style="margin-top:14px; color:#DD8B53; font-weight:600; font-size:14px;">Opening All Pages...</div>
    <div style="margin-top:6px; color:#A89F91; font-size:11px;">100% On-Device • Full Document Flow</div>
  </div>

  <script src="mammoth.browser.min.js"></script>
  <script src="html-docx.js"></script>
  <script>
    var originalFileName = 'document.docx';

    function execCmd(command, value) {
      document.execCommand(command, false, value || null);
      updateDocMetrics();
    }

    function execFormatBlock(tag) {
      document.execCommand('formatBlock', false, '<' + tag + '>');
      updateDocMetrics();
    }

    function insertParagraph() {
      var sel = window.getSelection();
      var p = document.createElement('p');
      p.innerHTML = '<br>';
      
      if (sel && sel.rangeCount > 0) {
        var range = sel.getRangeAt(0);
        var node = range.commonAncestorContainer;
        while (node && node.parentNode && node.parentNode.id !== 'document_canvas' && node.id !== 'document_canvas') {
          node = node.parentNode;
        }
        if (node && node.id !== 'document_canvas' && node.parentNode) {
          node.parentNode.insertBefore(p, node.nextSibling);
        } else {
          document.getElementById('document_canvas').appendChild(p);
        }
      } else {
        document.getElementById('document_canvas').appendChild(p);
      }
      
      // Focus the new paragraph
      var newRange = document.createRange();
      newRange.setStart(p, 0);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
      p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      updateDocMetrics();
    }

    function deleteCurrentBlock() {
      var sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;
      var node = sel.getRangeAt(0).commonAncestorContainer;
      while (node && node.parentNode && node.parentNode.id !== 'document_canvas' && node.id !== 'document_canvas') {
        node = node.parentNode;
      }
      if (node && node.id !== 'document_canvas' && node.parentNode) {
        node.remove();
        updateDocMetrics();
      }
    }

    function scrollToTop() {
      document.getElementById('editor_wrapper').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function scrollToBottom() {
      var wrapper = document.getElementById('editor_wrapper');
      wrapper.scrollTo({ top: wrapper.scrollHeight, behavior: 'smooth' });
    }

    function updateDocMetrics() {
      var canvas = document.getElementById('document_canvas');
      var text = canvas.innerText || '';
      var words = text.trim().length > 0 ? text.trim().split(/\s+/).length : 0;
      var chars = text.length;
      var estPages = Math.max(1, Math.ceil(chars / 1800));
      document.getElementById('doc_metrics').innerText = 
        estPages + (estPages === 1 ? ' Page' : ' Pages') + ' • ' + words + ' words';
    }

    function base64ToArrayBuffer(base64) {
      var binary_string = window.atob(base64);
      var len = binary_string.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function blobToBase64(blob, callback) {
      var reader = new FileReader();
      reader.onloadend = function() {
        var base64data = reader.result.split(',')[1];
        callback(base64data);
      };
      reader.readAsDataURL(blob);
    }

    window.loadDocument = function(base64Data, filename) {
      try {
        originalFileName = filename || 'document.docx';
        var arrayBuffer = base64ToArrayBuffer(base64Data);

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(function(result) {
            var html = result.value || '<p>Empty Document</p>';
            var canvas = document.getElementById('document_canvas');
            canvas.innerHTML = html;
            
            // Clean up any empty containers and ensure all tables fit
            var tables = canvas.getElementsByTagName('table');
            for (var i = 0; i < tables.length; i++) {
              tables[i].removeAttribute('width');
              tables[i].style.width = '100%';
            }

            document.getElementById('loading_overlay').style.display = 'none';
            updateDocMetrics();
            notifyFlutter('loaded', { warnings: result.messages });
          })
          .catch(function(err) {
            console.error('Mammoth conversion error:', err);
            document.getElementById('document_canvas').innerHTML = 
              '<p style="color:#B04A24; padding:16px;">Unable to load formatting: ' + err.message + '</p>';
            document.getElementById('loading_overlay').style.display = 'none';
            notifyFlutter('error', { error: err.message });
          });
      } catch (err) {
        console.error('Error in loadDocument:', err);
        document.getElementById('loading_overlay').innerHTML = 
          '<div style="color:#E5534B; padding:20px; text-align:center;"><b>Error loading document:</b><br>' + err.message + '</div>';
        notifyFlutter('error', { error: err.message });
      }
    };

    window.saveDocument = function() {
      try {
        var canvasHtml = document.getElementById('document_canvas').innerHTML;
        var fullHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + canvasHtml + '</body></html>';
        
        var convertedBlob = htmlDocx.asBlob(fullHtml);
        blobToBase64(convertedBlob, function(base64Output) {
          notifyFlutter('save', {
            base64: base64Output,
            filename: originalFileName,
            format: 'docx'
          });
        });
      } catch (err) {
        console.error('Error saving Word document:', err);
        notifyFlutter('error', { error: err.message });
      }
    };

    window.setZoomScale = function(scale) {
      var sheet = document.getElementById('editor_sheet');
      if (sheet) {
        sheet.style.transformOrigin = 'top center';
        sheet.style.transform = 'scale(' + scale + ')';
        sheet.style.transition = 'transform 0.15s ease-out';
      }
    };

    // Pinch-to-zoom gesture tracking
    var initialPinchDist = 0;
    var currentScale = 1.0;
    var scrollContainer = document.getElementById('editor_scroll_container');
    if (scrollContainer) {
      scrollContainer.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          initialPinchDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
        }
      }, { passive: true });

      scrollContainer.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2 && initialPinchDist > 0) {
          var dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          var factor = dist / initialPinchDist;
          var newScale = Math.min(Math.max(currentScale * factor, 0.7), 4.0);
          window.setZoomScale(newScale);
          notifyFlutter('zoomChanged', { zoom: newScale });
        }
      }, { passive: true });

      scrollContainer.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
          initialPinchDist = 0;
          var sheet = document.getElementById('editor_sheet');
          if (sheet && sheet.style.transform) {
            var match = sheet.style.transform.match(/scale\(([^)]+)\)/);
            if (match) currentScale = parseFloat(match[1]);
          }
        }
      });
    }

    function notifyFlutter(action, payload) {
      var msg = JSON.stringify({ action: action, payload: payload });
      if (window.SGReaderBridge) {
        window.SGReaderBridge.postMessage(msg);
      } else {
        console.log('Bridge message:', msg);
      }
    }

    // Auto-update metrics on content edit
    document.getElementById('document_canvas').addEventListener('input', function() {
      updateDocMetrics();
    });

    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        notifyFlutter('ready', {});
      }, 300);
    });
  </script>
</body>
</html>
