<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Social Googol SG Word Processor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #171310;
      color: #1F1913;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #toolbar_container {
      background-color: #1F1913;
      border-bottom: 1px solid #2E251E;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .toolbar-row::-webkit-scrollbar {
      display: none;
    }
    .t-btn {
      background: #282018;
      border: 1px solid #3D3126;
      color: #F2ECE1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
    }
    .t-btn:active, .t-btn.active {
      background: #B04A24;
      color: #FFFFFF;
      border-color: #DD8B53;
    }
    .btn-save {
      background-color: #B04A24;
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    #editor_wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px 60px 12px;
      display: flex;
      justify-content: center;
      background-color: #171310;
      -webkit-overflow-scrolling: touch;
    }
    #document_canvas {
      width: 100%;
      max-width: 820px;
      min-height: 85vh;
      background-color: #FFFFFF;
      color: #1A1A1A;
      padding: 24px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      outline: none;
      font-size: 15px;
      line-height: 1.6;
    }
    #document_canvas p {
      margin-bottom: 12px;
    }
    #document_canvas h1 {
      font-size: 22px;
      margin: 16px 0 10px 0;
      color: #111111;
    }
    #document_canvas h2 {
      font-size: 18px;
      margin: 14px 0 8px 0;
      color: #222222;
    }
    #document_canvas ul, #document_canvas ol {
      margin-left: 24px;
      margin-bottom: 12px;
    }
    #document_canvas table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
    }
    #document_canvas td, #document_canvas th {
      border: 1px solid #CCCCCC;
      padding: 8px;
    }
    #loading_overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171310;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 4px solid #2E251E;
      border-top: 4px solid #DD8B53;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="toolbar_container">
    <div class="toolbar-row" style="justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="background:#2E2218; border:1px solid #B04A24; color:#DD8B53; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:bold;">DOCX</span>
        <span style="color:#A89F91; font-size:11px;">WYSIWYG Word Editor</span>
      </div>
      <button class="btn-save" onclick="saveDocument()">Save Word</button>
    </div>
    <!-- Interactive Formatting Toolbar -->
    <div class="toolbar-row">
      <button class="t-btn" onclick="execCmd('bold')"><b>B</b></button>
      <button class="t-btn" onclick="execCmd('italic')"><i>I</i></button>
      <button class="t-btn" onclick="execCmd('underline')"><u>U</u></button>
      <button class="t-btn" onclick="execCmd('strikeThrough')"><s>S</s></button>
      <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
      <button class="t-btn" onclick="execFormatBlock('H1')">H1</button>
      <button class="t-btn" onclick="execFormatBlock('H2')">H2</button>
      <button class="t-btn" onclick="execFormatBlock('P')">P</button>
      <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
      <button class="t-btn" onclick="execCmd('insertUnorderedList')">• List</button>
      <button class="t-btn" onclick="execCmd('insertOrderedList')">1. List</button>
      <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
      <button class="t-btn" onclick="execCmd('justifyLeft')">Left</button>
      <button class="t-btn" onclick="execCmd('justifyCenter')">Center</button>
      <button class="t-btn" onclick="execCmd('justifyRight')">Right</button>
      <div style="width:1px; height:20px; background:#3D3126; margin:0 4px;"></div>
      <button class="t-btn" onclick="execCmd('undo')">↺ Undo</button>
      <button class="t-btn" onclick="execCmd('redo')">↻ Redo</button>
    </div>
  </div>

  <div id="editor_wrapper">
    <div id="document_canvas" contenteditable="true" spellcheck="false">
      <p>Loading document...</p>
    </div>
  </div>

  <div id="loading_overlay">
    <div class="spinner"></div>
    <div style="margin-top:14px; color:#DD8B53; font-weight:600; font-size:14px;">Loading Word Document...</div>
    <div style="margin-top:6px; color:#A89F91; font-size:11px;">100% On-Device Processing</div>
  </div>

  <script src="mammoth.browser.min.js"></script>
  <script src="html-docx.js"></script>
  <script>
    var originalFileName = 'document.docx';

    function execCmd(command, value) {
      document.execCommand(command, false, value || null);
      document.getElementById('document_canvas').focus();
    }

    function execFormatBlock(tag) {
      document.execCommand('formatBlock', false, '<' + tag + '>');
      document.getElementById('document_canvas').focus();
    }

    // Convert base64 string to ArrayBuffer
    function base64ToArrayBuffer(base64) {
      var binary_string = window.atob(base64);
      var len = binary_string.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) {
        bytes[i] = binary_string.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Convert Blob to base64
    function blobToBase64(blob, callback) {
      var reader = new FileReader();
      reader.onloadend = function() {
        var base64data = reader.result.split(',')[1];
        callback(base64data);
      };
      reader.readAsDataURL(blob);
    }

    // API called by Flutter via runJavaScript
    window.loadDocument = function(base64Data, filename) {
      try {
        originalFileName = filename || 'document.docx';
        var arrayBuffer = base64ToArrayBuffer(base64Data);

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(function(result) {
            var html = result.value || '<p>Empty Document</p>';
            document.getElementById('document_canvas').innerHTML = html;
            document.getElementById('loading_overlay').style.display = 'none';
            notifyFlutter('loaded', { warnings: result.messages });
          })
          .catch(function(err) {
            console.error('Mammoth conversion error:', err);
            // Fallback: Display error or plain text
            document.getElementById('document_canvas').innerHTML = '<p>Unable to load formatting: ' + err.message + '</p>';
            document.getElementById('loading_overlay').style.display = 'none';
            notifyFlutter('error', { error: err.message });
          });
      } catch (err) {
        console.error('Error in loadDocument:', err);
        document.getElementById('loading_overlay').innerHTML = 
          '<div style="color:#E5534B; padding:20px; text-align:center;"><b>Error loading document:</b><br>' + err.message + '</div>';
        notifyFlutter('error', { error: err.message });
      }
    };

    // Save document to .docx and notify Flutter
    window.saveDocument = function() {
      try {
        var canvasHtml = document.getElementById('document_canvas').innerHTML;
        var fullHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + canvasHtml + '</body></html>';
        
        var convertedBlob = htmlDocx.asBlob(fullHtml);
        blobToBase64(convertedBlob, function(base64Output) {
          notifyFlutter('save', {
            base64: base64Output,
            filename: originalFileName,
            format: 'docx'
          });
        });
      } catch (err) {
        console.error('Error saving Word document:', err);
        notifyFlutter('error', { error: err.message });
      }
    };

    function notifyFlutter(action, payload) {
      var msg = JSON.stringify({ action: action, payload: payload });
      if (window.SGReaderBridge) {
        window.SGReaderBridge.postMessage(msg);
      } else {
        console.log('Bridge message:', msg);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        notifyFlutter('ready', {});
      }, 300);
    });
  </script>
</body>
</html>
