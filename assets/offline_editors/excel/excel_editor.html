<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Social Googol SG Spreadsheet</title>
  <link rel="stylesheet" href="xspreadsheet.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #171310;
      color: #F2ECE1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    #top_header {
      background-color: #1F1913;
      border-bottom: 1px solid #2E251E;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .badge {
      background-color: #2E2218;
      border: 1px solid #B04A24;
      color: #DD8B53;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-save {
      background-color: #B04A24;
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    /* Touch-Friendly Cell & Formula Bar */
    #cell_editor_bar {
      background-color: #261F18;
      border-bottom: 1px solid #3D3126;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .formula-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #active_cell_badge {
      background-color: #171310;
      border: 1px solid #B04A24;
      color: #DD8B53;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      min-width: 48px;
      text-align: center;
    }
    #cell_input {
      flex: 1;
      background-color: #171310;
      border: 1px solid #3D3126;
      color: #FFFFFF;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    #cell_input:focus {
      border-color: #DD8B53;
    }
    .action-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .action-strip::-webkit-scrollbar {
      display: none;
    }
    .cell-btn {
      background-color: #1F1913;
      border: 1px solid #3D3126;
      color: #F2ECE1;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .cell-btn:active {
      background-color: #B04A24;
      color: #FFFFFF;
    }
    #grid_container {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      position: relative;
    }
    .x-spreadsheet {
      height: 100% !important;
      width: 100% !important;
    }
    #loading_overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #171310;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .spinner {
      border: 4px solid #2E251E;
      border-top: 4px solid #DD8B53;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="top_header">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="badge" id="doc_format_badge">EXCEL</span>
      <span id="doc_meta" style="color:#A89F91; font-size:12px;">Spreadsheet Suite</span>
    </div>
    <button class="btn-save" onclick="saveDocument()">Save File</button>
  </div>

  <!-- Dedicated Mobile Cell & Column Editor -->
  <div id="cell_editor_bar">
    <div class="formula-row">
      <span id="active_cell_badge">A1</span>
      <input type="text" id="cell_input" placeholder="Tap any cell to edit value or =formula..." oninput="onCellInputChanged(this.value)">
    </div>
    <div class="action-strip">
      <button class="cell-btn" onclick="insertRowBelow()">+ Row Below</button>
      <button class="cell-btn" onclick="insertColRight()">+ Col Right</button>
      <button class="cell-btn" onclick="deleteCurrentRow()">🗑 Delete Row</button>
      <button class="cell-btn" onclick="clearCurrentCell()">Clear Cell</button>
      <button class="cell-btn" onclick="insertFormula('SUM')">=SUM()</button>
      <button class="cell-btn" onclick="insertFormula('AVERAGE')">=AVERAGE()</button>
    </div>
  </div>

  <div id="grid_container"></div>

  <div id="loading_overlay">
    <div class="spinner"></div>
    <div style="margin-top:14px; color:#DD8B53; font-weight:600; font-size:14px;">Opening All Pages & Sheets...</div>
    <div style="margin-top:6px; color:#A89F91; font-size:11px;">100% On-Device Processing</div>
  </div>

  <script src="xlsx.full.min.js"></script>
  <script src="xspreadsheet.js"></script>
  <script>
    var xs = null;
    var currentFormat = 'xlsx';
    var originalFileName = '';
    var activeR = 0;
    var activeC = 0;
    var activeSheetIndex = 0;

    function initGrid(maxRows, maxCols) {
      var container = document.getElementById('grid_container');
      var totalRows = Math.max(maxRows || 150, 150);
      var totalCols = Math.max(maxCols || 30, 30);

      container.innerHTML = '';
      xs = x_spreadsheet('#grid_container', {
        showToolbar: true,
        showGrid: true,
        showContextmenu: true,
        view: {
          height: () => container.clientHeight,
          width: () => container.clientWidth,
        },
        row: {
          len: totalRows,
          height: 34, // Touch-friendly height
        },
        col: {
          len: totalCols,
          width: 100, // Finger-friendly width
          indexWidth: 44,
          minWidth: 60,
        }
      });

      // Listen to cell selection
      xs.on('cell-selected', function(cell, ri, ci) {
        activeR = ri;
        activeC = ci;
        updateActiveCellUI(cell, ri, ci);
      });

      xs.change(function() {
        var cell = xs.cell(activeR, activeC);
        updateActiveCellUI(cell, activeR, activeC);
      });
    }

    function indexToColName(c) {
      var s = '';
      var num = c + 1;
      while (num > 0) {
        var rem = (num - 1) % 26;
        s = String.fromCharCode(65 + rem) + s;
        num = Math.floor((num - 1) / 26);
      }
      return s;
    }

    function updateActiveCellUI(cell, ri, ci) {
      var colName = indexToColName(ci);
      var rowName = ri + 1;
      var cellRef = colName + rowName;
      document.getElementById('active_cell_badge').innerText = cellRef;

      var val = '';
      if (cell) {
        if (cell.formula) {
          val = '=' + cell.formula;
        } else if (cell.text != null) {
          val = cell.text;
        }
      }
      var input = document.getElementById('cell_input');
      if (document.activeElement !== input) {
        input.value = val;
      }
    }

    function onCellInputChanged(val) {
      if (!xs) return;
      var trimmed = val.trim();
      if (trimmed.startsWith('=')) {
        xs.cellText(activeR, activeC, '').reRender();
        // Set formula
        var data = xs.getData();
        if (data[activeSheetIndex] && data[activeSheetIndex].rows[activeR]) {
          var cells = data[activeSheetIndex].rows[activeR].cells || {};
          if (!cells[activeC]) cells[activeC] = {};
          cells[activeC].formula = trimmed.substring(1);
          cells[activeC].text = val;
          xs.loadData(data);
        }
      } else {
        xs.cellText(activeR, activeC, val).reRender();
      }
    }

    function insertRowBelow() {
      if (!xs) return;
      var data = xs.getData();
      var sheet = data[activeSheetIndex];
      if (!sheet || !sheet.rows) return;
      
      var newRows = {};
      var rKeys = Object.keys(sheet.rows).map(Number).sort((a,b) => a-b);
      rKeys.forEach(function(r) {
        if (r <= activeR) {
          newRows[r] = sheet.rows[r];
        } else {
          newRows[r + 1] = sheet.rows[r];
        }
      });
      newRows[activeR + 1] = { cells: {} };
      sheet.rows = newRows;
      sheet.row = sheet.row || {};
      sheet.row.len = (sheet.row.len || 100) + 1;
      xs.loadData(data);
      activeR = activeR + 1;
      updateActiveCellUI(null, activeR, activeC);
    }

    function insertColRight() {
      if (!xs) return;
      var data = xs.getData();
      var sheet = data[activeSheetIndex];
      if (!sheet || !sheet.rows) return;
      
      Object.keys(sheet.rows).forEach(function(r) {
        var row = sheet.rows[r];
        if (row && row.cells) {
          var newCells = {};
          Object.keys(row.cells).map(Number).sort((a,b) => a-b).forEach(function(c) {
            if (c <= activeC) {
              newCells[c] = row.cells[c];
            } else {
              newCells[c + 1] = row.cells[c];
            }
          });
          row.cells = newCells;
        }
      });
      sheet.col = sheet.col || {};
      sheet.col.len = (sheet.col.len || 30) + 1;
      xs.loadData(data);
      activeC = activeC + 1;
      updateActiveCellUI(null, activeR, activeC);
    }

    function deleteCurrentRow() {
      if (!xs) return;
      var data = xs.getData();
      var sheet = data[activeSheetIndex];
      if (!sheet || !sheet.rows) return;

      var newRows = {};
      Object.keys(sheet.rows).map(Number).sort((a,b) => a-b).forEach(function(r) {
        if (r < activeR) {
          newRows[r] = sheet.rows[r];
        } else if (r > activeR) {
          newRows[r - 1] = sheet.rows[r];
        }
      });
      sheet.rows = newRows;
      xs.loadData(data);
      updateActiveCellUI(xs.cell(activeR, activeC), activeR, activeC);
    }

    function clearCurrentCell() {
      if (!xs) return;
      xs.cellText(activeR, activeC, '').reRender();
      document.getElementById('cell_input').value = '';
    }

    function insertFormula(fnName) {
      var input = document.getElementById('cell_input');
      input.value = '=' + fnName + '(';
      input.focus();
      onCellInputChanged(input.value);
    }

    // Convert SheetJS workbook to x-spreadsheet data format
    function stox(wb) {
      var out = [];
      var maxOverallR = 0;
      var maxOverallC = 0;

      wb.SheetNames.forEach(function(name) {
        var o = { name: name, rows: {} };
        var ws = wb.Sheets[name];
        if (!ws) return;
        var ref = ws['!ref'] || 'A1:A1';
        var range = XLSX.utils.decode_range(ref);
        if (range.e.r > maxOverallR) maxOverallR = range.e.r;
        if (range.e.c > maxOverallC) maxOverallC = range.e.c;

        for (var R = range.s.r; R <= range.e.r; ++R) {
          var row = {};
          var hasCells = false;
          for (var C = range.s.c; C <= range.e.c; ++C) {
            var cell = ws[XLSX.utils.encode_cell({c: C, r: R})];
            if (!cell) continue;
            var cellObj = { text: cell.w || (cell.v != null ? String(cell.v) : '') };
            if (cell.f) cellObj.formula = cell.f;
            row[C] = cellObj;
            hasCells = true;
          }
          if (hasCells) {
            o.rows[R] = { cells: row };
          }
        }
        out.push(o);
      });
      return { sheets: out, maxRows: maxOverallR + 30, maxCols: maxOverallC + 10 };
    }

    // Convert x-spreadsheet data format to SheetJS workbook
    function xtos(sdata) {
      var out = XLSX.utils.book_new();
      sdata.forEach(function(xws) {
        var ws = {};
        var rowKeys = Object.keys(xws.rows || {});
        var maxR = 0, maxC = 0;
        rowKeys.forEach(function(r) {
          var ri = parseInt(r, 10);
          if (ri > maxR) maxR = ri;
          var cells = xws.rows[r].cells || {};
          Object.keys(cells).forEach(function(c) {
            var ci = parseInt(c, 10);
            if (ci > maxC) maxC = ci;
            var cell = cells[c];
            if (!cell) return;
            var val = cell.text || '';
            var cellObj = { t: 's', v: val };
            if (!isNaN(val) && val.trim() !== '') {
              cellObj = { t: 'n', v: Number(val) };
            }
            if (cell.formula) {
              cellObj.f = cell.formula;
            }
            ws[XLSX.utils.encode_cell({c: ci, r: ri})] = cellObj;
          });
        });
        ws['!ref'] = XLSX.utils.encode_range({s: {c: 0, r: 0}, e: {c: maxC, r: maxR}});
        XLSX.utils.book_append_sheet(out, ws, xws.name || 'Sheet1');
      });
      return out;
    }

    window.loadDocument = function(base64Data, filename) {
      try {
        originalFileName = filename || 'document.xlsx';
        var ext = originalFileName.split('.').pop().toLowerCase();
        currentFormat = (ext === 'xls' || ext === 'csv') ? ext : 'xlsx';
        document.getElementById('doc_format_badge').innerText = currentFormat.toUpperCase();

        var wb = XLSX.read(base64Data, { type: 'base64' });
        var parsed = stox(wb);

        initGrid(parsed.maxRows, parsed.maxCols);

        if (parsed.sheets.length > 0) {
          xs.loadData(parsed.sheets);
        } else {
          xs.loadData([{ name: 'Sheet1', rows: {} }]);
        }

        document.getElementById('loading_overlay').style.display = 'none';
        notifyFlutter('loaded', { sheetCount: wb.SheetNames.length });
        updateActiveCellUI(xs.cell(0, 0), 0, 0);
      } catch (err) {
        console.error('Error in loadDocument:', err);
        document.getElementById('loading_overlay').innerHTML = 
          '<div style="color:#E5534B; padding:20px; text-align:center;">' +
          '<b>Failed to open spreadsheet:</b><br>' + err.message + '</div>';
        notifyFlutter('error', { error: err.message });
      }
    };

    window.saveDocument = function() {
      try {
        if (!xs) return;
        var xdata = xs.getData();
        var wb = xtos(xdata);
        var bookType = (currentFormat === 'csv') ? 'csv' : 'xlsx';
        var base64Output = XLSX.write(wb, { bookType: bookType, type: 'base64' });

        notifyFlutter('save', {
          base64: base64Output,
          filename: originalFileName,
          format: bookType
        });
      } catch (err) {
        console.error('Error saving document:', err);
        notifyFlutter('error', { error: err.message });
      }
    };

    window.setZoomScale = function(scale) {
      var grid = document.getElementById('grid_container');
      if (grid) {
        grid.style.transformOrigin = 'top left';
        grid.style.transform = 'scale(' + scale + ')';
        grid.style.width = (100 / scale) + '%';
        grid.style.height = (100 / scale) + '%';
        grid.style.transition = 'transform 0.15s ease-out';
      }
    };

    // Pinch-to-zoom support for spreadsheet grid
    var initialPinchDist = 0;
    var currentScale = 1.0;
    var gridEl = document.getElementById('grid_container');
    if (gridEl) {
      gridEl.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          initialPinchDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
        }
      }, { passive: true });

      gridEl.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2 && initialPinchDist > 0) {
          var dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          var factor = dist / initialPinchDist;
          var newScale = Math.min(Math.max(currentScale * factor, 0.6), 3.5);
          window.setZoomScale(newScale);
          notifyFlutter('zoomChanged', { zoom: newScale });
        }
      }, { passive: true });

      gridEl.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
          initialPinchDist = 0;
          if (gridEl.style.transform) {
            var match = gridEl.style.transform.match(/scale\(([^)]+)\)/);
            if (match) currentScale = parseFloat(match[1]);
          }
        }
      });
    }

    function notifyFlutter(action, payload) {
      var msg = JSON.stringify({ action: action, payload: payload });
      if (window.SGReaderBridge) {
        window.SGReaderBridge.postMessage(msg);
      } else {
        console.log('Bridge message:', msg);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      initGrid(150, 30);
      setTimeout(function() {
        notifyFlutter('ready', {});
      }, 300);
    });
  </script>
</body>
</html>
